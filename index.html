  c.removeAttribute('data-theme');c.removeAttribute('style');location.hash=hash;
  return a.publish('<!DOCTYPE html>\n'+c.outerHTML);
 }).catch(function(e){say('Lưu không được: '+((e&&e.message)||'lỗi'))});
}
function buildDoc(){var c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(posts.concat(all.filter(function(x){return x.about}))).replace(/</g,'\\u003c');c.removeAttribute('data-theme');c.removeAttribute('style');return '<!DOCTYPE html>\n'+c.outerHTML}
function download(){claude.use('downloads').then(function(d){if(!d){say('Không tải được ở đây.');return}return d.save({filename:'index.html',data:buildDoc()})}).catch(function(e){if(!e||e.code!=='declined')say('Tải không được.')})}
function aboutPage(){var a=all.filter(function(x){return x.about})[0];if(!a)return home();var b=a.body.slice(),sig=b.pop();
 return '<article><div class="meta">Giới thiệu</div><h1>'+esc(a.title)+'</h1>'+fmt(b)+'<p style="text-align:right;font-style:italic;color:var(--muted)">'+esc(sig)+'</p><div class="bar"><a class="btn alt" href="#">Đọc các bài viết →</a></div></article>'}
function render(){
 var h=location.hash.replace('#',''),html='',on='n-home',p,bind=null;
 if(h.indexOf('chu-de-')===0){html=home(h.slice(7))}
 else if(h.indexOf('series-')===0){html=seriesPage(h.slice(7))}
 else if(h==='gioi-thieu'||h==='thoi-quen-viet'){html=aboutPage();on='n-about'}
 else if(h==='viet-bai'&&canEdit){html=editor();bind=function(){document.getElementById('save').onclick=function(){save(null)}}}
 else if(h.indexOf('sua-')===0&&canEdit&&(p=posts.filter(function(x){return x.id===h.slice(4)})[0])){html=editor(p);bind=function(){document.getElementById('save').onclick=function(){save(p.id)}}}
 else if((p=posts.filter(function(x){return x.id===h})[0])){
  var tools=canEdit?'<div class="bar"><a class="btn alt" href="#sua-'+p.id+'">Sửa bài</a><button class="btn alt" id="del">Xóa bài</button><span id="msg"></span></div>':'';
  html='<article id="post"><a class="back" href="#">← Tất cả bài viết</a><div class="meta" style="margin-top:22px">'+meta(p)+'</div>'+badge(p)+'<h1>'+esc(p.title)+'</h1>'+fmt(p.body)+seriesNav(p)+tools+'</article>';
  bind=function(){var d=document.getElementById('del');if(!d)return;d.onclick=function(){if(armed!==p.id){armed=p.id;d.textContent='Bấm lần nữa để xóa';return}posts=posts.filter(function(x){return x.id!==p.id});commit('#')}};
 } else html=home();
 app.innerHTML=html;
 document.getElementById('n-home').className=on==='n-home'?'on':'';document.getElementById('n-about').className=on==='n-about'?'on':'';
 
 if(bind)bind();
 initTb();
 var dl=document.getElementById('dl');if(dl)dl.onclick=download;
 var qi=document.getElementById('q');if(qi)qi.oninput=function(){document.getElementById('plist').innerHTML=cards(curF,qi.value)};
 var fd=document.getElementById('f-draft'),sv=document.getElementById('save');if(fd&&sv){var upd=function(){sv.textContent=fd.checked?'Lưu nháp':'Lưu và đăng'};fd.onchange=upd;upd()}
 window.scrollTo(0,0);onScroll();
}
function onScroll(){var y=window.pageYOffset||document.documentElement.scrollTop,max=document.documentElement.scrollHeight-window.innerHeight,pg=document.getElementById('pg'),tp=document.getElementById('top'),post=!!document.getElementById('post');
 if(pg){pg.style.display=post?'block':'none';pg.style.width=(post&&max>0?Math.min(100,y/max*100):0)+'%'}
 if(tp)tp.className=y>600?'show':''}
window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('resize',onScroll);
document.getElementById('top').onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('theme').onclick=function(){var r=document.documentElement,cur=r.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';r.setAttribute('data-theme',n);r.style.colorScheme=n;try{localStorage.setItem('theme',n)}catch(e){}};
window.addEventListener('hashchange',render);
render();
(function(){
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
function R(a,b){return a+Math.random()*(b-a)}
function ease(p){return .5-.5*Math.cos(Math.PI*p)}
function run(){
var logo=document.querySelector('header .logo');
if(!logo||!logo.animate)return;
var r=logo.getBoundingClientRect();
if(r.bottom<0||r.top>window.innerHeight)return;
var fillP=logo.querySelector('path[fill-opacity]');
var tx=r.left+r.width*.37,ty=r.top+r.height*.3,N=5,items=[],k;
var box=document.createElement('div');
box.setAttribute('aria-hidden','true');
box.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:hidden';
var defs='<svg width="0" height="0" style="position:absolute"><defs><radialGradient id="bg1" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#b57544"/><stop offset=".45" stop-color="#744322"/><stop offset="1" stop-color="#2e1509"/></radialGradient></defs></svg>';
var bean='<svg viewBox="0 0 60 40" style="display:block;width:100%;height:auto"><ellipse cx="30" cy="20" rx="28" ry="18.5" fill="url(#bg1)" stroke="rgba(255,225,190,.3)" stroke-width="1"/><ellipse cx="21" cy="12" rx="10" ry="4" fill="rgba(255,235,210,.16)" transform="rotate(-18 21 12)"/><path d="M5 21.5C18 10 42 30 55 18.5" fill="none" stroke="rgba(255,215,170,.32)" stroke-width="2.6" stroke-linecap="round"/><path d="M5 20C18 8.5 42 28.5 55 17" fill="none" stroke="#1b0b04" stroke-width="3.4" stroke-linecap="round"/></svg>';
box.innerHTML=defs;document.body.appendChild(box);
logo.style.transformOrigin='50% 92%';
if(fillP)fillP.style.transition='fill-opacity 1.4s ease-in-out';
function onHit(i){
 logo.animate([{transform:'none'},{transform:'translateY(1.2px) scale(1.025,.965)'},{transform:'none'}],{duration:i===N-1?1500:1100,easing:'ease-in-out'});
 if(fillP)fillP.style.fillOpacity=(.14+(i+1)/N*.24).toFixed(2)}
for(k=0;k<N;k++){
 var s=R(11,15),side=k%2?1:-1,e=document.createElement('div');
 e.style.cssText='position:absolute;left:0;top:0;width:'+s+'px;opacity:0;will-change:transform,opacity';
 e.innerHTML=bean;box.appendChild(e);
 items.push({e:e,k:k,s:s,dl:k*1150+R(0,300),dur:R(4600,5400),
  sx:tx+side*R(60,140)-s/2,sy:-s-24,lx:tx+R(-3,3)-s/2,ly0:ty-s/2,ey:ty-s/2+r.height*.24,
  r0:R(-40,40),rd:(Math.random()<.5?-1:1)*R(50,110),A:R(10,22)*side,ph:R(0,6.28),hit:false,done:false})}
var t0=performance.now(),finished=0,lastHit=0;
function frame(now){
 var t=now-t0;
 items.forEach(function(b){
  if(b.done)return;
  var p=(t-b.dl)/b.dur;
  if(p<=0)return;
  if(p>=1){b.done=true;finished++;b.e.remove();return}
  var ye=.3*p+.7*ease(p),y=b.sy+(b.ey-b.sy)*ye,
      x=b.sx+(b.lx-b.sx)*ease(p)+b.A*Math.sin(p*7.2+b.ph)*Math.pow(1-p,2),
      op=Math.min(1,p/.14),sc=1;
  if(y>b.ly0){var q=ease(Math.min(1,(y-b.ly0)/(b.ey-b.ly0)));op*=1-q;sc=1-.45*q;
   if(!b.hit){b.hit=true;lastHit=now;onHit(b.k)}}
  b.e.style.opacity=op.toFixed(3);
  b.e.style.transform='translate3d('+x.toFixed(2)+'px,'+y.toFixed(2)+'px,0) rotate('+(b.r0+b.rd*p).toFixed(2)+'deg) scale('+sc.toFixed(3)+')'});
 if(finished<N)requestAnimationFrame(frame);
 else setTimeout(function(){
  if(fillP){fillP.style.transition='fill-opacity 2.8s ease-in-out';fillP.style.fillOpacity=''}
  setTimeout(function(){if(fillP)fillP.style.transition='';logo.style.transformOrigin='';box.remove()},3000)},1200)}
requestAnimationFrame(frame);
}
if(document.visibilityState==='visible')run();else document.addEventListener('visibilitychange',function h(){if(document.visibilityState==='visible'){document.removeEventListener('visibilitychange',h);run()}});
})();
if(window.claude&&claude.use)claude.use('user').then(function(u){if(u&&u.canEdit()){canEdit=true;posts=all.filter(function(p){return !p.about});render()}}).catch(function(){});
</script>
